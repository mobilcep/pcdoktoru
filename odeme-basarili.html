<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ödeme Başarılı — PC Doktoru</title>
  <style>
    :root { --bg:#070a11; --surface:#111722; --border:#1d2636; --accent:#3b82f6; --text:#eef3fb; --muted:#8b9cb8; --ok:#22c55e; }
    body { margin:0; font-family: Inter, "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.25rem; text-align:center; }
    .ok-icon { width:64px; height:64px; border-radius:50%; background:rgba(34,197,94,.15); color:var(--ok); display:grid; place-items:center; margin:0 auto 1.25rem; font-size:1.8rem; }
    h1 { font-size:1.55rem; margin-bottom:.5rem; }
    .sub { color:var(--muted); margin-bottom:1.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.5rem; text-align:left; }
    .anahtar { font-family: ui-monospace, monospace; font-size:1.05rem; letter-spacing:.04em; word-break:break-all; background:#0e1521; padding:1rem; border-radius:10px; border:1px solid rgba(59,130,246,.3); }
    .btn { display:inline-block; margin-top:1rem; background:var(--accent); color:#fff; padding:.75rem 1.4rem; border-radius:10px; text-decoration:none; font-weight:600; border:none; cursor:pointer; }
    .btn.outline { background:transparent; border:1px solid var(--border); color:var(--text); margin-left:.5rem; }
    .steps { color:var(--muted); font-size:.88rem; margin-top:1.25rem; line-height:1.6; }
    .yukleniyor { color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ok-icon">✓</div>
    <h1>Ödemeniz alındı</h1>
    <p class="sub">Lisans anahtarınızı aşağıdan kopyalayıp uygulamada etkinleştirin.</p>

    <div class="card">
      <p class="yukleniyor" id="durum">Anahtar hazırlanıyor…</p>
      <div id="icerik" hidden>
        <div style="font-size:.82rem;color:var(--muted);margin-bottom:.5rem">Lisans anahtarınız</div>
        <div class="anahtar" id="anahtar">—</div>
        <button class="btn outline" type="button" id="kopyala">Kopyala</button>
        <a class="btn" href="/indir">Uygulamayı indir</a>
        <div class="steps">
          1. ZIP'i indirip <strong>PC Doktoru.exe</strong> çalıştırın.<br />
          2. Lisans ekranında anahtarı yapıştırın.<br />
          3. Aynı anahtar <span id="plan-etiket">bireysel</span> planında <strong id="cihaz-sayisi">2</strong> cihaza kadar kullanılabilir.
        </div>
      </div>
    </div>
  </div>
  <script>
    const ref = new URLSearchParams(location.search).get("ref");
    const durum = document.getElementById("durum");
    const icerik = document.getElementById("icerik");
    const anahtarEl = document.getElementById("anahtar");

    async function yukle() {
      if (!ref) {
        durum.textContent = "Sipariş referansı bulunamadı. destek@pcdoktoru.com.tr";
        return;
      }
      try {
        const res = await fetch("/api/odeme/sonuc?ref=" + encodeURIComponent(ref));
        const data = await res.json();
        if (!data.ok || !data.anahtar) {
          durum.textContent = data.mesaj || "Anahtar henüz hazır değil. Birkaç dakika sonra yenileyin veya destek@pcdoktoru.com.tr";
          return;
        }
        durum.hidden = true;
        icerik.hidden = false;
        anahtarEl.textContent = data.anahtar;
        document.getElementById("plan-etiket").textContent = data.plan || "bireysel";
        document.getElementById("cihaz-sayisi").textContent = data.plan === "aile" ? "5" : "2";
      } catch {
        durum.textContent = "Bağlantı hatası. Sayfayı yenileyin.";
      }
    }
    document.getElementById("kopyala").addEventListener("click", async () => {
      const t = anahtarEl.textContent;
      if (!t || t === "—") return;
      await navigator.clipboard.writeText(t);
      document.getElementById("kopyala").textContent = "Kopyalandı ✓";
    });
    yukle();
  </script>
</body>
</html>
