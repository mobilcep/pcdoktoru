<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ödeme Başarısız — PC Doktoru</title>
  <style>
    :root { --bg:#070a11; --surface:#111722; --border:#1d2636; --accent:#3b82f6; --text:#eef3fb; --muted:#8b9cb8; --bad:#f87171; }
    body { margin:0; font-family: Inter, "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 520px; margin: 0 auto; padding: 2.5rem 1.25rem; text-align:center; }
    .icon { width:64px; height:64px; border-radius:50%; background:rgba(248,113,113,.12); color:var(--bad); display:grid; place-items:center; margin:0 auto 1.25rem; font-size:1.6rem; }
    h1 { font-size:1.45rem; }
    .sub { color:var(--muted); margin:1rem 0 1.5rem; }
    a.btn { display:inline-block; background:var(--accent); color:#fff; padding:.75rem 1.4rem; border-radius:10px; text-decoration:none; font-weight:600; margin:.25rem; }
    a.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">✕</div>
    <h1>Ödeme tamamlanamadı</h1>
    <p class="sub" id="neden">İşlem iptal edildi veya kart reddedildi.</p>
    <a class="btn" href="/satin-al">Tekrar dene</a>
    <a class="btn ghost" href="mailto:destek@pcdoktoru.com.tr">Destek</a>
  </div>
  <script>
    const n = new URLSearchParams(location.search).get("neden");
    if (n) document.getElementById("neden").textContent = decodeURIComponent(n);
  </script>
</body>
</html>
